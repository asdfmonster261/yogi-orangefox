# Build OrangeFox for the Pixel 11 (malibu) family and publish the three release assets.
# Manually triggered: a release is a decision, and main3 builds this in ~8 minutes against
# roughly an hour here. What CI buys is that what people flash came from what is pushed.
#
# The assets are deliberately the same three the hand-built releases ship:
#   OrangeFox-R12.0-yogi-unassembled.img  OrangeFox's raw two-fragment vendor_boot. NOT
#                                         flashable on its own; create-orangefox-yogi.sh
#                                         grafts it onto the user's own first-stage.
#   OrangeFox-R12.0-yogi.zip              AnyKernel3 repack zip; grafts on device instead.
#   create-orangefox-yogi.sh              the no-root client path.
# Grafting stays on the client on purpose: a CI-grafted image would be pinned to whatever
# build CI happened to fetch, which is the staleness the client-side graft exists to avoid.
name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: tag to publish under (leave blank to build and attach artifacts only)
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FOX: /home/runner/fox
      SYNC: https://gitlab.com/OrangeFox/sync.git
      OF_BRANCH: '14.1'

    steps:
      - name: Check out the device tree
        uses: actions/checkout@v4
        with:
          path: devicetree

      # Unlike the kernel workflow, this cleanup is REQUIRED, not headroom. The synced
      # tree plus build output peaks near 94 GB (51 GB of it AOSP prebuilts, and .repo
      # cannot be dropped because build.sh itself runs repo sync for gflags and guava).
      # An uncleaned runner leaves about 58 GB free, which does not fit.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /opt/az
          sudo docker image prune -af || true
          df -h / | tail -1

      - name: Add swap
        run: |
          sudo fallocate -l 16G /swap.img
          sudo chmod 600 /swap.img
          sudo mkswap /swap.img
          sudo swapon /swap.img
          free -g | head -2

      # The fox scripts invoke a bare `python`, which a runner does not provide at all.
      # 3.11 rather than whatever is newest because main3's 3.14 broke them, and 3.11 is
      # what the conda env there pins.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the build dependencies
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          sudo apt-get -qq update
          sudo apt-get -qq install -y bc bison build-essential ccache flex g++-multilib \
            gcc-multilib git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3-pip openjdk-17-jdk
          python --version

      # orangefox_sync.sh already syncs shallow (repo init --depth=1, --no-tags) and
      # applies the OFRP-specific patches the build depends on, so it is used as-is
      # rather than reimplemented.
      - name: Sync the OrangeFox tree
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git clone --depth=1 "$SYNC" "$HOME/sync"
          bash "$HOME/sync/orangefox_sync.sh" --branch "$OF_BRANCH" --path "$FOX"
          df -h / | tail -1

      - name: Overlay our device tree
        run: |
          mkdir -p "$FOX/device/google/pixels"
          rsync -a --delete --exclude .git --exclude .github \
            "$GITHUB_WORKSPACE/devicetree/" "$FOX/device/google/pixels/"
          test -f "$FOX/device/google/pixels/build.sh"

      # No -j: build.sh already defaults JOBS to nproc.
      - name: Build
        working-directory: /home/runner/fox
        run: bash device/google/pixels/build.sh --family malibu

      # build.sh names its output with the OrangeFox version and family, but the release
      # asset name is fixed: create-orangefox-yogi.sh hardcodes
      # releases/latest/download/OrangeFox-R12.0-yogi-unassembled.img, so renaming it
      # wrongly silently breaks the no-root install path for everyone.
      - name: Collect the three assets
        run: |
          mkdir -p out
          raw=$(ls "$FOX"/builds/OrangeFox-*-malibu.img)
          [ "$(printf '%s\n' "$raw" | wc -l)" = 1 ] || { echo "expected one raw image, got:"; echo "$raw"; exit 1; }
          cp "$raw" out/OrangeFox-R12.0-yogi-unassembled.img
          bash "$GITHUB_WORKSPACE/devicetree/orangefox-ak3/build-of-ak3.sh" \
            out/OrangeFox-R12.0-yogi-unassembled.img out/OrangeFox-R12.0-yogi.zip
          cp "$GITHUB_WORKSPACE/devicetree/create-orangefox-yogi.sh" out/
          ls -l out/

      # The raw image is two fragments and must stay that way: an assembled image here
      # would be pinned to CI's stock boot, and build-of-ak3.sh would reject it anyway.
      - name: Sanity-check the assets
        run: |
          test "$(stat -c%s out/OrangeFox-R12.0-yogi-unassembled.img)" -gt 33554432
          unzip -l out/OrangeFox-R12.0-yogi.zip | grep -q anykernel.sh
          unzip -l out/OrangeFox-R12.0-yogi.zip | grep -q 'tools/magiskboot'
          head -1 out/create-orangefox-yogi.sh | grep -q '^#!'

      - uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12.0-yogi
          path: out/*
          if-no-files-found: error

      - name: Publish
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          OrangeFox Recovery R12.0 for the Pixel 11 family (yogi, cubs, grizzly, kodiak).

          | file | use |
          |---|---|
          | `OrangeFox-R12.0-yogi.zip` | Flash from KernelFlasher or an existing OrangeFox. Grafts onto your own vendor_boot on device, so one zip works on any build. |
          | `create-orangefox-yogi.sh` | First install with no root and no custom recovery. Run it on a PC or in Termux; it fetches the image below and grafts it against your own stock vendor_boot. |
          | `OrangeFox-R12.0-yogi-unassembled.img` | Downloaded by the script above. NOT flashable on its own. |

          Only yogi is hardware-tested. cubs, grizzly and kodiak are blind ports.
          MD
          gh release create "${{ inputs.release_tag }}" out/* \
            --title "OrangeFox R12.0 (malibu)" --notes-file notes.md
